<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signature banner render</title>
<!-- Source for public/email-signature/banner.png. Rendered at 2x with headless Edge (see README.md). -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Allison&family=Montserrat:wght@600&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #000F1A; }
  .banner {
    position: relative; width: 600px; height: 180px; overflow: hidden;
    background: #000F1A url(../assets/card-bg.png) right center / auto 100% no-repeat;
  }
  .photo { position: absolute; left: -18px; bottom: 0; height: 176px; }
  .text { position: absolute; left: 232px; top: 30px; }
  .wm { position: relative; display: inline-flex; flex-direction: column; align-items: flex-start; padding-top: 14px; }
  .wm-first { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 34px; line-height: 1; color: #FAF9F4; }
  .wm-script { font-family: 'Allison', cursive; font-size: 62px; line-height: .5; color: #14B8A6; align-self: flex-end; margin-top: 5px; margin-right: -4px; }
  .wm-route { position: absolute; top: -12px; right: -18px; width: 54px; }
  .wm-strokes { position: absolute; top: 4px; left: -20px; width: 15px; }
  .role { margin-top: 26px; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: .2em; color: #FAF9F4; }
  .role .tick { display: inline-block; width: 18px; height: 2px; background: #F7C03E; vertical-align: middle; margin-right: 8px; }
  .meta { margin-top: 9px; font-family: 'Space Mono', monospace; font-size: 10.5px; color: rgba(250,249,244,.6); }
</style>
</head>
<body>
  <div class="banner">
    <img class="photo" src="../assets/card-photo.png" alt="">
    <div class="text">
      <span class="wm">
        <img class="wm-route" src="../assets/accent-route.png" alt="">
        <img class="wm-strokes" src="../assets/accent-strokes.png" alt="">
        <span class="wm-first">Raquel</span>
        <span class="wm-script">Soares</span>
      </span>
      <div class="role"><span class="tick"></span>ESG &amp; DIGITAL TRANSFORMATION</div>
      <div class="meta">15+ yrs &middot; data &times; esg &times; strategy</div>
    </div>
  </div>
</body>
</html>
