<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raquel Soares — Email signature</title>
<style>
  body { margin: 0; padding: 32px 16px; background: #F1EBE3; font-family: Arial, Helvetica, sans-serif; color: #062747; }
  .wrap { max-width: 600px; margin: 0 auto; }
  .help { font-size: 13px; line-height: 1.5; margin-bottom: 20px; }
  .help b { color: #0E8577; }
  .sig-box { background: #FFFFFF; padding: 24px; border-radius: 8px; }
  button { margin-top: 16px; font: 600 12px Arial, sans-serif; letter-spacing: .1em; background: #062747; color: #FAF9F4; border: 0; padding: 10px 18px; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <p class="help">Click <b>Copy signature</b>, then paste it into Gmail → Settings → General → Signature (or Outlook → Signatures).</p>

  <div class="sig-box">
    <!-- SIGNATURE START: inline styles only, so it survives email clients -->
    <div id="signature">
      <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; width:560px; max-width:100%; font-family:Arial, Helvetica, sans-serif;">
        <tr>
          <td style="padding:0;">
            <a href="https://rapaulasoares.github.io/portfolio/" target="_blank" style="text-decoration:none;">
              <img src="https://rapaulasoares.github.io/portfolio/email-signature/banner.png" width="560" height="168" alt="Raquel Soares — ESG &amp; Digital Transformation Specialist" style="display:block; width:560px; max-width:100%; height:auto; border:0; border-radius:6px;">
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:12px 2px 0 2px; font-size:13px; line-height:20px; color:#062747;">
            <span style="display:inline-block; width:18px; height:2px; background:#F7C03E; vertical-align:middle; margin-right:8px;"></span><a href="mailto:rapaulasoares@gmail.com" style="color:#062747; text-decoration:none;">rapaulasoares@gmail.com</a>
            <span style="color:#14B8A6; padding:0 8px;">|</span>
            <a href="https://www.linkedin.com/in/raquel-de-paula-soares" target="_blank" style="color:#0E8577; text-decoration:none; font-weight:bold;">LinkedIn</a>
            <span style="color:#14B8A6; padding:0 8px;">|</span>
            <a href="https://rapaulasoares.github.io/portfolio/" target="_blank" style="color:#0E8577; text-decoration:none; font-weight:bold;">Portfolio</a>
          </td>
        </tr>
        <tr>
          <td style="padding:4px 2px 0 2px; font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:12px; line-height:18px; color:#5b6b7a;">
            Sustainability intelligence: turning ESG data into decisions.
          </td>
        </tr>
      </table>
    </div>
    <!-- SIGNATURE END -->
  </div>

  <button id="copy" type="button">COPY SIGNATURE</button>
</div>
<script>
  document.getElementById('copy').addEventListener('click', async function () {
    var el = document.getElementById('signature');
    try {
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([el.innerHTML], { type: 'text/html' }),
        'text/plain': new Blob([el.innerText], { type: 'text/plain' })
      })]);
    } catch (e) {
      var r = document.createRange(); r.selectNodeContents(el);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      document.execCommand('copy'); s.removeAllRanges();
    }
    this.textContent = 'COPIED ✓';
  });
</script>
</body>
</html>
